<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zombie Arena</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: rgba(18, 25, 35, 0.86);
      --line: rgba(255,255,255,0.09);
      --text: #e8edf7;
      --muted: #9db0c9;
      --accent: #a5d6ff;
      --danger: #ff5d73;
      --safe: #7ef2a2;
      --warning: #ffc857;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, #172131 0%, #0d1117 45%, #090b0e 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      position: relative;
      width: min(94vw, 980px);
      height: min(94vh, 900px);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,0.38);
      background: rgba(9,12,18,0.9);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at center, #1b2a3b 0%, #0e1a29 34%, #091016 100%);
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
      backdrop-filter: blur(6px);
    }

    .stats {
      padding: 10px 12px 8px;
      display: flex;
      gap: 18px;
      align-items: center;
      min-width: 280px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .stat .label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat .value {
      font-weight: 700;
      font-size: 18px;
    }

    .weapons {
      position: absolute;
      right: 14px;
      top: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
      pointer-events: auto;
    }

    .weapon-row {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.02);
      transition: 0.15s ease;
      cursor: pointer;
    }

    .weapon-row.active {
      border-color: rgba(165,214,255,0.7);
      background: rgba(165,214,255,0.12);
      box-shadow: inset 0 0 0 1px rgba(165,214,255,0.15);
    }

    .weapon-row .key {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      border: 1px solid rgba(165,214,255,0.4);
      border-radius: 6px;
      background: rgba(165,214,255,0.05);
    }

    .weapon-row .name {
      font-weight: 600;
      font-size: 13px;
    }

    .weapon-row .ammo {
      font-size: 11px;
      color: var(--muted);
      font-family: "SFMono-Regular", monospace;
    }

    .message {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(12, 15, 19, 0.82);
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .upgrade-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(5, 9, 14, 0.52);
      z-index: 2;
    }

    .upgrade-overlay.show {
      display: flex;
    }

    .upgrade-panel {
      width: min(76vw, 780px);
      background: rgba(18, 25, 35, 0.96);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.32);
      padding: 22px 18px 16px;
    }

    .upgrade-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 8px;
    }

    .upgrade-header h2 {
      margin: 0;
      font-size: clamp(20px, 3vw, 32px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .upgrade-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(200px, 1fr));
      gap: 16px;
    }

    .upgrade-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 14px;
      color: var(--text);
      cursor: pointer;
      transition: 0.16s ease;
      min-height: 138px;
      text-align: left;
    }

    .upgrade-card:hover {
      transform: translateY(-2px);
      border-color: rgba(165,214,255,0.65);
      box-shadow: 0 12px 24px rgba(0,0,0,0.18);
    }

    .upgrade-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .upgrade-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .tag {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="app">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="topbar">
        <div class="panel stats">
          <div class="stat">
            <span class="label">HP</span>
            <span class="value" id="hp">100 / 100</span>
          </div>
          <div class="stat">
            <span class="label">Wave</span>
            <span class="value" id="wave">1</span>
          </div>
          <div class="stat">
            <span class="label">Score</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="stat">
            <span class="label">Ammo</span>
            <span class="value" id="ammo">12 / 12</span>
          </div>
        </div>

        <div id="weaponPanel" class="panel weapons"></div>
      </div>

      <div id="message" class="message">Wave 1</div>

      <div id="upgradeOverlay" class="upgrade-overlay">
        <div class="upgrade-panel">
          <div class="upgrade-header">
            <h2>Choose an Upgrade</h2>
          </div>
          <div class="upgrade-grid" id="upgradeGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ARENA = 28;
    const PLAYER_SPEED = 7;
    const ZOMBIE_POOL = 60;
    const BULLET_POOL = 100;

    const WeaponIdValues = ["pistol", "shotgun", "smg", "rifle", "revolver", "flamethrower", "launcher"];
    const WEAPONS = {
      pistol: { name: "Pistol", cooldown: 0.25, damage: 1, pellets: 1, spread: 0.02, pierce: 0, speed: 30, mag: 12, reloadTime: 1.1, desc: "Reliable sidearm" },
      shotgun: { name: "Shotgun", cooldown: 0.7, damage: 1, pellets: 6, spread: 0.35, pierce: 0, speed: 26, mag: 6, reloadTime: 1.8, desc: "6-pellet close spread" },
      smg: { name: "SMG", cooldown: 0.07, damage: 0.6, pellets: 1, spread: 0.12, pierce: 0, speed: 32, mag: 30, reloadTime: 1.3, desc: "High fire-rate spray" },
      rifle: { name: "Rifle", cooldown: 2.0, damage: 5, pellets: 1, spread: 0, pierce: 4, speed: 48, mag: 5, reloadTime: 2.2, desc: "Heavy piercing shot with 2s delay" },
      revolver: { name: "Revolver", cooldown: 0.65, damage: 3.2, pellets: 1, spread: 0.01, pierce: 1, speed: 38, mag: 6, reloadTime: 1.5, desc: "Heavy hand cannon" },
      flamethrower: { name: "Flamethrower", cooldown: 0.05, damage: 0.28, pellets: 2, spread: 0.25, pierce: 10, speed: 18, mag: 60, reloadTime: 2.0, desc: "Continuous burning stream" },
      launcher: { name: "Launcher", cooldown: 1.3, damage: 8, pellets: 1, spread: 0.04, pierce: 0, speed: 22, mag: 3, reloadTime: 2.6, desc: "Explosive rocket AoE", isExplosive: true },
    };

    const UpgradeDefinitions = {
      rapid: { name: "Hair Trigger", desc: "+25% fire rate" },
      heavy: { name: "Heavy Rounds", desc: "+35% bullet damage" },
      pierce: { name: "Piercing", desc: "Bullets pierce +1 extra zombie" },
      speed: { name: "Fleet Foot", desc: "+15% move speed" },
      armor: { name: "Thick Skin", desc: "+25 max health & full heal" },
      vampire: { name: "Bloodthirst", desc: "Heal +2 HP on every kill" },
      magsize: { name: "Extended Mag", desc: "+30% magazine capacity" },
      pistol: { name: "Pistol", desc: "" },
      shotgun: { name: "Shotgun", desc: "New gun: 6-pellet blast" },
      smg: { name: "SMG", desc: "New gun: very fast spray" },
      rifle: { name: "Rifle", desc: "New gun: piercing 2s sniper" },
      revolver: { name: "Revolver", desc: "New gun: high-damage hand cannon" },
      flamethrower: { name: "Flamethrower", desc: "New gun: streams of fire" },
      launcher: { name: "Launcher", desc: "New gun: explosive blast rockets" },
    };

    const STAT_UPGRADES = ["rapid", "heavy", "pierce", "speed", "armor", "vampire", "magsize"];

    function pickKind(wave, r) {
      if (wave >= 6 && r < 0.15) return "tank";
      if (wave >= 5 && r < 0.3) return "spitter";
      if (wave >= 4 && r < 0.45) return "brute";
      if (wave >= 3 && r < 0.6) return "bloater";
      if (wave >= 2 && r < 0.8) return "runner";
      return "walker";
    }

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    function makeGame() {
      const initialAmmo = {};
      for (const k of WeaponIdValues) initialAmmo[k] = WEAPONS[k].mag;

      return {
        px: 0, pz: 0, aim: 0, hp: 100, maxHp: 100, score: 0, wave: 1,
        toSpawn: 6, spawnT: 0, fireT: 0, hurtT: 0, over: false, started: true,
        zombies: Array.from({ length: ZOMBIE_POOL }, () => ({
          alive: false, x: 0, z: 0, hp: 0, speed: 0, hit: 0, kind: "walker", dmg: 25, attackT: 0,
        })),
        bullets: Array.from({ length: BULLET_POOL }, () => ({
          alive: false, x: 0, z: 0, vx: 0, vz: 0, life: 0, dmg: 1, pierce: 0, hitIds: [], weapon: "pistol",
          isEnemy: false, isExplosive: false,
        })),
        events: { shots: 0, kills: 0, bites: 0, reloads: 0 },
        weapon: "pistol", owned: ["pistol"], ammo: initialAmmo,
        reloading: false, reloadT: 0, reloadTotal: 1,
        levels: {}, choosing: false, choices: [],
      };
    }

    function getMagCapacity(g, w) {
      const base = WEAPONS[w].mag;
      const magBonus = 1 + 0.3 * (g.levels["magsize"] ?? 0);
      return Math.max(1, Math.round(base * magBonus));
    }

    function lvl(g, id) {
      return g.levels[id] ?? 0;
    }

    function rollChoices(g, rand = Math.random) {
      const pool = [...STAT_UPGRADES, ...WeaponIdValues.filter((w) => !g.owned.includes(w))];
      const out = [];
      while (out.length < 3 && pool.length) {
        out.push(pool.splice(Math.floor(rand() * pool.length), 1)[0]);
      }
      return out;
    }

    function pickUpgrade(g, id) {
      if (!g.choosing) return;
      if (id in WEAPONS) {
        const w = id;
        if (!g.owned.includes(w)) g.owned.push(w);
        g.weapon = w;
        g.ammo[w] = getMagCapacity(g, w);
      } else {
        g.levels[id] = (g.levels[id] ?? 0) + 1;
        if (id === "armor") { g.maxHp += 25; g.hp = g.maxHp; }
        if (id === "magsize") {
          for (const w of g.owned) g.ammo[w] = getMagCapacity(g, w);
        }
      }
      g.choosing = false;
      g.choices = [];
      updateWeaponPanel();
      updateHud();
    }

    function switchWeapon(g, slot) {
      const w = WeaponIdValues[slot];
      if (w && g.owned.includes(w)) {
        g.weapon = w;
        g.reloading = false;
        g.reloadT = 0;
      }
      updateWeaponPanel();
      updateHud();
    }

    function triggerReload(g) {
      if (g.reloading) return;
      const max = getMagCapacity(g, g.weapon);
      if ((g.ammo[g.weapon] ?? 0) >= max) return;
      g.reloading = true;
      g.reloadTotal = WEAPONS[g.weapon].reloadTime;
      g.reloadT = g.reloadTotal;
      g.events.reloads++;
    }

    function step(g, inp, dt, rand = Math.random) {
      if (g.over || g.choosing) return;

      const speed = PLAYER_SPEED * (1 + 0.15 * lvl(g, "speed"));
      const len = Math.hypot(inp.mx, inp.mz) || 1;
      const moving = inp.mx || inp.mz ? 1 : 0;

      g.px = clamp(g.px + (inp.mx / len) * speed * dt * moving, -ARENA, ARENA);
      g.pz = clamp(g.pz + (inp.mz / len) * speed * dt * moving, -ARENA, ARENA);
      g.aim = Math.atan2(inp.aimX - g.px, inp.aimZ - g.pz);
      g.hurtT = Math.max(0, g.hurtT - dt);

      if (inp.reload && !g.reloading) triggerReload(g);

      if (g.reloading) {
        g.reloadT -= dt;
        if (g.reloadT <= 0) {
          g.ammo[g.weapon] = getMagCapacity(g, g.weapon);
          g.reloading = false;
          g.reloadT = 0;
        }
      }

      const w = WEAPONS[g.weapon];
      g.fireT -= dt;

      if (inp.firing && !g.reloading) {
        if ((g.ammo[g.weapon] ?? 0) <= 0) {
          triggerReload(g);
        } else if (g.fireT <= 0) {
          g.ammo[g.weapon]--;
          g.fireT = w.cooldown / (1 + 0.25 * lvl(g, "rapid"));
          g.events.shots++;

          for (let p = 0; p < w.pellets; p++) {
            const b = g.bullets.find((b) => !b.alive);
            if (!b) break;
            const a = g.aim + (rand() - 0.5) * w.spread * 2;
            Object.assign(b, {
              alive: true, weapon: g.weapon, x: g.px, z: g.pz,
              vx: Math.sin(a) * w.speed, vz: Math.cos(a) * w.speed, life: 1.2,
              dmg: w.damage * (1 + 0.35 * lvl(g, "heavy")),
              pierce: w.pierce + lvl(g, "pierce"), hitIds: [],
              isEnemy: false, isExplosive: !!w.isExplosive,
            });
          }

          if (g.ammo[g.weapon] <= 0) {
            triggerReload(g);
          }
        }
      }

      g.spawnT -= dt;
      if (g.toSpawn > 0 && g.spawnT <= 0) {
        const z = g.zombies.find((z) => !z.alive);
        if (z) {
          const a = rand() * Math.PI * 2;
          const kind = pickKind(g.wave, rand());
          const baseHp = 2 + Math.floor(g.wave / 3);
          const baseSp = 1.8 + g.wave * 0.18 + rand() * 0.8;
          const st = {
            walker: [1, 1, 25],
            runner: [0.55, 1.85, 16],
            brute: [4, 0.65, 50],
            bloater: [1.6, 0.8, 0],
            spitter: [1.2, 0.9, 20],
            tank: [6.5, 0.5, 45],
          }[kind];

          Object.assign(z, {
            alive: true, kind, x: Math.sin(a) * ARENA * 1.1, z: Math.cos(a) * ARENA * 1.1,
            hp: Math.max(1, baseHp * st[0]), speed: baseSp * st[1], dmg: st[2], hit: 0, attackT: 1.5,
          });
          g.toSpawn--;
          g.spawnT = Math.max(0.2, 1.3 - g.wave * 0.08);
        }
      }

      for (const b of g.bullets) {
        if (!b.alive) continue;
        b.x += b.vx * dt;
        b.z += b.vz * dt;
        b.life -= dt;

        if (b.life <= 0) {
          b.alive = false;
          continue;
        }

        if (b.isEnemy) {
          if (Math.hypot(b.x - g.px, b.z - g.pz) < 0.8) {
            g.hp -= b.dmg;
            g.hurtT = 0.3;
            g.events.bites++;
            b.alive = false;
          }
          continue;
        }

        for (let i = 0; i < g.zombies.length; i++) {
          const z = g.zombies[i];
          if (z.alive && !b.hitIds.includes(i) && Math.hypot(z.x - b.x, z.z - b.z) < 0.75) {
            b.hitIds.push(i);
            const damageMultiplier = z.kind === "tank" ? 0.55 : 1;
            z.hp -= b.dmg * damageMultiplier;
            z.hit = 0.12;

            if (b.isExplosive) {
              for (const other of g.zombies) {
                if (other.alive && Math.hypot(other.x - b.x, other.z - b.z) < 3.2) {
                  other.hp -= b.dmg * 0.7;
                  other.hit = 0.15;
                }
              }
            }

            if (z.hp <= 0) {
              z.alive = false;
              g.events.kills++;
              const scoreMulti = { walker: 1, runner: 2, bloater: 2, brute: 4, spitter: 3, tank: 5 }[z.kind];
              g.score += 10 * g.wave * scoreMulti;
              g.hp = Math.min(g.maxHp, g.hp + 2 * lvl(g, "vampire"));
            }

            if (b.pierce-- <= 0) {
              b.alive = false;
              break;
            }
          }
        }
      }

      let alive = 0;
      for (const z of g.zombies) {
        if (!z.alive) continue;
        alive++;
        z.hit = Math.max(0, z.hit - dt);
        z.attackT -= dt;

        const dx = g.px - z.x;
        const dz = g.pz - z.z;
        const d = Math.hypot(dx, dz) || 1;

        if (z.kind === "spitter" && d < 10) {
          if (d < 5) {
            z.x -= (dx / d) * z.speed * dt * 0.7;
            z.z -= (dz / d) * z.speed * dt * 0.7;
          }
          if (z.attackT <= 0) {
            z.attackT = 2.4;
            const acid = g.bullets.find((b) => !b.alive);
            if (acid) {
              Object.assign(acid, {
                alive: true, weapon: "pistol", isEnemy: true, x: z.x, z: z.z,
                vx: (dx / d) * 12, vz: (dz / d) * 12, life: 2.0, dmg: 18,
                pierce: 0, hitIds: [], isExplosive: false,
              });
            }
          }
          continue;
        }

        const reach = z.kind === "brute" || z.kind === "tank" ? 1.4 : 0.9;
        if (d > reach) {
          z.x += (dx / d) * z.speed * dt;
          z.z += (dz / d) * z.speed * dt;
        } else if (z.kind === "bloater") {
          z.alive = false;
          alive--;
          g.hp -= 32;
          g.hurtT = 0.4;
          g.events.bites++;
          g.events.kills++;
          for (const o of g.zombies) if (o.alive && Math.hypot(o.x - z.x, o.z - z.z) < 3.2) o.hp -= 4;
        } else {
          if (g.hurtT <= 0) g.events.bites++;
          g.hp -= z.dmg * dt;
          g.hurtT = 0.35;
        }
      }

      if (g.hp <= 0) {
        g.hp = 0;
        g.over = true;
        showMessage("Game Over — press any key to restart");
        return;
      }

      if (alive === 0 && g.toSpawn === 0) {
        g.wave++;
        g.toSpawn = 6 + g.wave * 3;
        g.spawnT = 2;
        for (const b of g.bullets) b.alive = false;
        for (const w of g.owned) g.ammo[w] = getMagCapacity(g, w);
        g.reloading = false;
        g.choosing = true;
        g.choices = rollChoices(g, Math.random);
        populateUpgradeCards();
        showMessage("Choose your upgrade");
      }
    }

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const weaponPanel = document.getElementById("weaponPanel");
    const upgradeGrid = document.getElementById("upgradeGrid");
    const upgradeOverlay = document.getElementById("upgradeOverlay");
    const messageEl = document.getElementById("message");

    let game = makeGame();
    let keys = {};
    let mouse = { x: 0, y: 0, down: false };

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function showMessage(text) {
      messageEl.textContent = text;
    }

    function updateHud() {
      document.getElementById("hp").textContent = `${Math.ceil(game.hp)} / ${game.maxHp}`;
      document.getElementById("wave").textContent = String(game.wave);
      document.getElementById("score").textContent = String(Math.floor(game.score));
      const currentAmmo = game.ammo[game.weapon] ?? 0;
      const cap = getMagCapacity(game, game.weapon);
      document.getElementById("ammo").textContent = `${currentAmmo} / ${cap}`;

      if (game.reloading) {
        messageEl.textContent = `Reloading ${game.reloadT.toFixed(1)}s`;
      } else if (game.choosing) {
        messageEl.textContent = "Choose your upgrade";
      } else if (!game.over) {
        messageEl.textContent = `Wave ${game.wave}`;
      }
    }

    function updateWeaponPanel() {
      weaponPanel.innerHTML = "";
      for (let i = 0; i < WeaponIdValues.length; i++) {
        const id = WeaponIdValues[i];
        const owned = game.owned.includes(id);
        const row = document.createElement("div");
        row.className = "weapon-row" + (game.weapon === id ? " active" : "");
        if (!owned) {
          row.style.opacity = "0.35";
          row.title = "Locked";
        }
        row.innerHTML = `
          <div class="key">${i + 1}</div>
          <div class="name">${WEAPONS[id].name}</div>
          <div class="ammo">${owned ? (game.ammo[id] ?? 0) : "-"}</div>
        `;
        row.addEventListener("click", () => {
          if (owned) switchWeapon(game, i);
        });
        weaponPanel.appendChild(row);
      }
    }

    function populateUpgradeCards() {
      upgradeGrid.innerHTML = "";
      upgradeOverlay.classList.add("show");
      for (const id of game.choices) {
        const def = UpgradeDefinitions[id];
        const card = document.createElement("button");
        card.className = "upgrade-card";
        card.type = "button";
        card.innerHTML = `
          <div class="tag">Upgrade</div>
          <h3>${def.name}</h3>
          <p>${def.desc}</p>
        `;
        card.addEventListener("click", () => {
          pickUpgrade(game, id);
          upgradeOverlay.classList.remove("show");
          updateHud();
        });
        upgradeGrid.appendChild(card);
      }
    }

    function restart() {
      game = makeGame();
      showMessage("Wave 1");
      updateWeaponPanel();
      updateHud();
      upgradeOverlay.classList.remove("show");
    }

    function handleInput() {
      const moveX = (keys["d"] || keys["arrowright"] ? 1 : 0) - (keys["a"] || keys["arrowleft"] ? 1 : 0);
      const moveZ = (keys["s"] || keys["arrowdown"] ? 1 : 0) - (keys["w"] || keys["arrowup"] ? 1 : 0);

      const rect = canvas.getBoundingClientRect();
      const px = (mouse.x - rect.left) / rect.width * canvas.width;
      const py = (mouse.y - rect.top) / rect.height * canvas.height;

      const worldScale = (canvas.width / 900) * 1.2;
      const centerX = canvas.width * 0.5;
      const centerY = canvas.height * 0.5;

      const aimX = (px - centerX) / worldScale + game.px;
      const aimZ = (centerY - py) / worldScale + game.pz;

      const input = {
        mx: moveX,
        mz: moveZ,
        aimX,
        aimZ,
        firing: mouse.down,
        reload: !!keys["r"],
      };

      step(game, input, 1 / 60, Math.random);
      updateHud();
    }

    function drawArena() {
      const w = canvas.width;
      const h = canvas.height;
      const worldScale = (w / 900) * 1.2;

      ctx.clearRect(0, 0, w, h);

      const cx = w * 0.5;
      const cy = h * 0.5;

      ctx.save();
      ctx.translate(cx, cy);

      const arenaRadius = (ARENA * 2 + 3) * worldScale;
      ctx.strokeStyle = "rgba(180,220,255,0.18)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, arenaRadius, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 * i) / 6;
        const x = Math.sin(a) * arenaRadius;
        const y = -Math.cos(a) * arenaRadius;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(x, y);
        ctx.strokeStyle = "rgba(255,255,255,0.04)";
        ctx.stroke();
      }

      const px = game.px * worldScale;
      const pz = -(game.pz * worldScale);

      ctx.fillStyle = "#7dd3fc";
      ctx.beginPath();
      ctx.arc(px, pz, 0.7 * worldScale, 0, Math.PI * 2);
      ctx.fill();

      const aimLen = 1.3 * worldScale;
      const aimX = Math.sin(game.aim) * aimLen;
      const aimY = -Math.cos(game.aim) * aimLen;
      ctx.strokeStyle = "#dbeafe";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px, pz);
      ctx.lineTo(px + aimX, pz + aimY);
      ctx.stroke();

      for (const b of game.bullets) {
        if (!b.alive) continue;
        const bx = b.x * worldScale;
        const bz = -b.z * worldScale;
        ctx.fillStyle = b.isEnemy ? "#ff7b72" : "#ffd86b";
        ctx.beginPath();
        ctx.arc(bx, bz, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const z of game.zombies) {
        if (!z.alive) continue;
        const x = z.x * worldScale;
        const y = -z.z * worldScale;
        let color = "#a3e635";
        if (z.kind === "runner") color = "#fbbf24";
        if (z.kind === "brute") color = "#f87171";
        if (z.kind === "bloater") color = "#c084fc";
        if (z.kind === "spitter") color = "#fb7185";
        if (z.kind === "tank") color = "#ef4444";

        const r = z.kind === "tank" ? 1.5 * worldScale : z.kind === "brute" ? 1.3 * worldScale : 0.9 * worldScale;

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();

        if (z.hit > 0) {
          ctx.strokeStyle = "rgba(255,255,255,0.6)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, r + 5, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function loop() {
      handleInput();
      drawArena();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;

      if (key === "1") switchWeapon(game, 0);
      if (key === "2") switchWeapon(game, 1);
      if (key === "3") switchWeapon(game, 2);
      if (key === "4") switchWeapon(game, 3);
      if (key === "5") switchWeapon(game, 4);
      if (key === "6") switchWeapon(game, 5);
      if (key === "7") switchWeapon(game, 6);

      if (game.over && key.length === 1) restart();
    });

    document.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    canvas.addEventListener("mousedown", () => {
      mouse.down = true;
    });

    window.addEventListener("mouseup", () => {
      mouse.down = false;
    });

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    restart();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
